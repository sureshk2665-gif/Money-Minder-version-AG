name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Publishes a downloadable APK to Releases so it can be installed
      # straight from a phone, without signing in to GitHub.
      - name: Publish APK to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v1.0.${{ github.run_number }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found to publish"
            exit 1
          fi
          cp "$APK" "money-minder-$VERSION.apk"
          gh release create "$VERSION" "money-minder-$VERSION.apk" \
            --title "Money Minder $VERSION" \
            --notes "Debug build of ${{ github.sha }}.

          Tap the \`.apk\` below on your phone to install. You may need to allow
          installs from unknown sources the first time." \
            --latest
